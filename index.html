<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` is what turns the safe-area insets on. Both
         platforms report zero for env(safe-area-inset-*) without it, and
         Capacitor's Android SystemBars plugin reads this exact string off the
         meta tag to decide whether to hand the insets to the web layer at all.
         The app draws under the status bar either way; the insets are how the
         layout knows to keep its content out from under it. See the safe area
         section of src/shared/styles/tokens.css.

         The scale is pinned at 1 because iOS zooms the page in whenever a text
         input with a computed font-size under 16px takes focus, and never zooms
         back out when it blurs. Every input in the app is under that threshold
         by design — the search field is 15px, the edit-in-place rename 13px —
         and the search sheet autofocuses, so opening it was enough to leave a
         zoomed, pannable web view behind after it closed. WKWebView honours the
         scale limits (mobile Safari, which ignores them, is not a surface this
         app ships on), so this is the fix rather than a 16px floor on type the
         design chose deliberately. Nothing here is meant to zoom: html, body
         and #root are all `overflow: hidden`. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Paint Codex</title>
    <!-- Fonts are self-hosted; see src/shared/styles/fonts.css -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
