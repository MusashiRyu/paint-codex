name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Covers app, test, node and tools projects — all strict.
      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Test
        run: npm test

      # Catches anything that typechecks but fails to bundle.
      - name: Build
        run: npx vite build

      # Layout invariants at seven phone widths, in a real engine. jsdom has no
      # layout, so `npm test` cannot see a wrapped flex line or a column that
      # ended up narrower than its contents. Chrome ships on the runner image;
      # the launcher finds it at /usr/bin/google-chrome.
      - name: Layout check
        run: npm run check:layout
